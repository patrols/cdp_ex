version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Grouped into one PR per run to
  # keep the noise down; Dependabot rewrites each pin's exact `# vX.Y.Z`
  # comment along with its SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
